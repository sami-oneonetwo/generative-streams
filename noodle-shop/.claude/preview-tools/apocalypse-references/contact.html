<!doctype html><html><body style="margin:0;background:#18232d;color:white;font:16px sans-serif"><div id="grid"></div><script>const games=[['Project Zomboid',108600,6],['DYSMANTLE',846770,6],['HumanitZ',1766060,6],['The Last Stand: Aftermath',1266840,6],['They Are Billions',644930,6],['Welcome to ParadiZe',1519090,5]];document.getElementById('grid').innerHTML=games.map(([name,id,n])=>`<section style="height:315px"><h3 style="margin:5px">${name}</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">${Array.from({length:n},(_,i)=>`<div style="position:relative"><img src="${id}-${i}.jpg" style="width:100%;height:132px;object-fit:contain"><b style="position:absolute;top:4px;left:6px;background:black">${i}</b></div>`).join('')}</div></section>`).join('');</script></body></html>
