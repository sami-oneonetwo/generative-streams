<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corner House</title><style>
:root{color-scheme:dark;--ink:#e4e2cf;--muted:#adb6a4;--panel:#1c2724ed;--line:#9ba48655}*{box-sizing:border-box}body{margin:0;background:#26342e;color:var(--ink);font:14px/1.5 'Segoe UI',sans-serif;overflow:hidden}#world{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:pan-y}header{position:fixed;top:25px;left:28px;right:28px;display:flex;justify-content:space-between;gap:20px;pointer-events:none}h1{font:700 21px 'Trebuchet MS',sans-serif;margin:0;text-shadow:0 2px 7px #14251b}header small{display:block;font:10px Consolas,monospace;letter-spacing:.07em;margin-top:7px}.invite{font:11px/1.6 Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:10px 15px}#fixture{background:#c3af7c;color:#253027;padding:6px 10px;font:11px Consolas,monospace;position:fixed;top:85px;left:28px}#work{position:fixed;bottom:28px;left:28px;max-width:min(530px,calc(100% - 56px));background:var(--panel);border:1px solid var(--line);padding:17px 21px}#phase{color:#ccb681;letter-spacing:.08em;font:10px Consolas,monospace;margin-bottom:7px}#label{font-size:17px;font-weight:500}#next,#author{font:11px/1.5 Consolas,monospace;color:var(--muted);margin-top:8px}#progress{height:3px;background:#4d574b;margin-top:13px}#bar{height:100%;width:0;background:#c9b782;transition:width .5s linear}#speech{position:fixed;left:0;top:0;max-width:min(19em,calc(100vw - 32px));background:#efe9d3;color:#1f2b23;padding:.5em .8em .55em;border-radius:1em;font:500 calc(15px*var(--ui-scale,1))/1.3 'Segoe UI',sans-serif;pointer-events:none;box-shadow:0 3px 14px #0007;overflow-wrap:anywhere;--tail:50%}#speech::after{content:"";position:absolute;left:var(--tail);bottom:-.42em;width:.85em;height:.85em;background:#efe9d3;transform:translateX(-50%) rotate(45deg);border-radius:.12em}#speech.long{max-width:min(26em,calc(100vw - 32px));font-size:calc(13.5px*var(--ui-scale,1))}#speech.pop{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(.3em) scale(.94)}to{opacity:1;transform:none}}#status{position:fixed;bottom:30px;right:28px;font:10px/1.8 Consolas,monospace;color:var(--ink);text-shadow:0 1px 5px #152a1d;text-align:right}a{color:inherit;opacity:.7}a:hover{opacity:1}a:focus-visible{outline:2px solid #ccb681;outline-offset:4px}#error{position:fixed;left:16px;right:16px;top:35%;background:var(--panel);padding:25px;max-width:600px;margin:auto}#inspect{position:fixed;right:28px;top:100px;max-width:250px;background:var(--panel);padding:12px 16px;border:1px solid var(--line);font-size:12px;pointer-events:none}[hidden]{display:none!important}@media(max-width:650px){header{left:16px;right:16px;top:18px}h1{font-size:16px}.invite{font-size:9px;padding:8px;max-width:145px}header small{font-size:8px}#fixture{left:16px;top:80px;font-size:9px}#work{left:16px;bottom:48px;max-width:calc(100% - 32px);padding:13px}#label{font-size:14px}#speech{font-size:calc(12.5px*var(--ui-scale,1))}#speech.long{font-size:calc(11.5px*var(--ui-scale,1))}#status{right:16px;bottom:10px}#inspect{right:16px;top:130px;max-width:200px}}@media(prefers-reduced-motion:reduce){#bar{transition:none}#speech.pop{animation:none}}
#tools{position:fixed;right:28px;top:85px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}button,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px;font:11px Consolas,monospace;max-width:220px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ccb681;outline-offset:3px}#inspect{top:140px;pointer-events:auto;overflow-wrap:anywhere}#tools label{font:10px Consolas,monospace}#inspect p{color:var(--muted)}@media(max-width:650px){#tools{right:16px;top:115px;max-width:calc(100% - 32px)}#inspect{top:195px}select{max-width:165px}}
body.stream header,body.stream #work,body.stream #status,body.stream #fixture,body.stream #inspect{zoom:var(--ui-scale,1)}body.stream #tools,body.stream #status a,body.stream #status br{display:none}
#people{position:fixed;inset:0;pointer-events:none;overflow:hidden}.tag{position:absolute;width:max-content;transform:translate(-50%,-100%);font:600 calc(11px*var(--ui-scale,1))/1 Consolas,monospace;letter-spacing:.06em;color:var(--ink);background:#1c2724cc;border:1px solid var(--line);padding:.3em .55em;border-radius:.7em;white-space:nowrap}.tag.cross{border-color:#c47a6a}.tag.fond{border-color:#8fb07a}.tag.alert{background:#5a2f2acc;border-color:#e28a72aa}.tag.viewer{background:#1c272488;border-color:#9ba48633;font-size:calc(9.5px*var(--ui-scale,1));opacity:.85}.say{position:absolute;width:max-content;transform:translate(-50%,-100%);max-width:min(15em,calc(100vw - 32px));background:#e6e9d8;color:#1f2b23;padding:.4em .7em .45em;border-radius:.9em;font:500 calc(12.5px*var(--ui-scale,1))/1.3 'Segoe UI',sans-serif;box-shadow:0 3px 12px #0006;overflow-wrap:anywhere;text-align:center}.say::after{content:"";position:absolute;left:50%;bottom:-.36em;width:.72em;height:.72em;background:#e6e9d8;transform:translateX(-50%) rotate(45deg);border-radius:.1em}@media(max-width:650px){.tag{font-size:calc(9px*var(--ui-scale,1))}.say{font-size:calc(10.5px*var(--ui-scale,1))}}
#badges{display:flex;flex-direction:column;align-items:center;gap:8px;align-self:flex-start}#wave,#hoops{font:11px/1.5 Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:9px 16px;text-align:center;min-width:190px}#wave strong,#hoops strong{display:block;font:700 19px 'Trebuchet MS',sans-serif;letter-spacing:.08em;color:#e5c98c}#hoops strong{font-size:14px;color:#d9a55c}#wave.live strong{color:#e28a72}#wave span,#hoops span{display:block;color:var(--muted)}#wave-detail{color:var(--ink)}#hoops-rows span:first-child{color:var(--ink)}.tag.pop{font:800 calc(12px*var(--ui-scale,1))/1 'Trebuchet MS',sans-serif;letter-spacing:.1em;opacity:1;background:#1c2724dd}.tag.pop.hit{color:#a9d98a;border-color:#8fb07a}.tag.pop.miss{color:#c9c4b4;border-color:#9ba48655}.tag.pop.honk{color:#e5c98c;border-color:#d9a55c}.tag.pop.verb{color:#e5c98c;border-color:#d9a55c}@media(max-width:650px){#wave,#hoops{min-width:0;padding:6px 9px;font-size:9px}#wave strong{font-size:13px}#hoops strong{font-size:11px}}
</style></head><body><main id="world" aria-label="Live chat-built safehouse"></main><header><div><h1>118 WILLOW STREET</h1><small>A LITTLE PLACE WE'RE KEEPING ALIVE</small></div><div id="badges"><div id="wave" hidden><strong id="wave-title">WAVE 1</strong><span id="wave-detail"></span><span id="wave-record"></span></div><div id="hoops" hidden><strong>HOOPS</strong><span id="hoops-rows"></span></div></div><div class="invite">What should we build next?<br>Tell Rook in chat.</div></header><div id="fixture" hidden>FIXTURE MODE · NO LIVE AI</div><div id="tools"><button id="follow" aria-pressed="true">Following activity</button><label for="creations">Inspect </label><select id="creations"><option value="">Choose a creation</option></select></div><aside id="inspect" hidden><strong id="inspect-name"></strong><p id="inspect-detail"></p><p id="inspect-example"></p><button id="inspect-close">Close</button></aside><div id="people" aria-hidden="true"></div><div id="speech" role="status" aria-label="Rook says" hidden></div><section id="work" aria-live="polite"><div id="phase">CONNECTING</div><div id="label">Finding the safehouse…</div><div id="author"></div><div id="progress" hidden><div id="bar"></div></div><div id="next"></div></section><div id="status"><span id="connection">Connecting…</span><br><a href="/admin" target="_blank" rel="noopener">Operator controls ↗</a></div><div id="error" hidden></div><script src="/safehouse.js"></script></body></html>
