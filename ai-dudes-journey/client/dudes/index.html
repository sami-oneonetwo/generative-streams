<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Dudes</title><style>
:root{color-scheme:dark;--ink:#e4e2cf;--muted:#adb6a4;--panel:#1c2724ed;--line:#9ba48655;--accent:#ccb681}*{box-sizing:border-box}body{margin:0;background:#b9c2a6;color:var(--ink);font:14px/1.5 'Segoe UI',sans-serif;overflow:hidden}#world{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:25px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;pointer-events:none}h1{font:700 21px 'Trebuchet MS',sans-serif;letter-spacing:.06em;margin:0;text-shadow:0 2px 7px #14251b}header small{display:block;font:10px Consolas,monospace;letter-spacing:.07em;margin-top:7px;text-shadow:0 1px 5px #14251b}.invite{font:11px/1.6 Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:10px 15px;max-width:230px}
#fixture{background:#c3af7c;color:#253027;padding:6px 10px;font:11px Consolas,monospace;position:fixed;top:85px;left:28px}
#side{position:fixed;right:28px;top:85px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100% - 32px)}#tools{display:flex;gap:8px;align-items:center}#corner{position:fixed;right:28px;bottom:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}button{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px;font:11px Consolas,monospace;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#inspect{width:260px;max-width:calc(100% - 32px);background:var(--panel);padding:12px 16px;border:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}#inspect strong{font-size:14px}#inspect p{margin:6px 0;color:var(--muted)}#inspect #inspect-doing{color:var(--ink)}#inspect #inspect-say{font-style:italic}
#feed{position:fixed;left:28px;bottom:28px;max-width:min(420px,calc(100% - 56px));background:var(--panel);border:1px solid var(--line);padding:8px 13px;font:11.5px/1.55 Consolas,monospace;pointer-events:none}#feed div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .4s}
#status{font:10px/1.8 Consolas,monospace;color:var(--ink);text-shadow:0 1px 5px #152a1d;text-align:right}#ai-warn{display:block;width:max-content;margin-left:auto;background:#7a3a2e;color:#f3e3d2;padding:1px 7px;letter-spacing:.08em;text-shadow:none;margin-bottom:3px}a{color:inherit;opacity:.7}a:hover{opacity:1}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
#error{position:fixed;left:16px;right:16px;top:35%;background:var(--panel);padding:25px;max-width:600px;margin:auto}[hidden]{display:none!important}
#people{position:fixed;inset:0;pointer-events:none;overflow:hidden}#people>div{position:absolute;left:0;top:0;will-change:transform}
.tag{width:max-content;font:600 calc(11px*var(--ui-scale,1))/1 Consolas,monospace;letter-spacing:.06em;color:var(--ink);background:#1c2724cc;border:1px solid var(--line);padding:.3em .55em;border-radius:.7em;white-space:nowrap;text-align:center}.tag .t{color:var(--muted);font-weight:400}.tag .job{font:400 calc(9.5px*var(--ui-scale,1))/1.2 Consolas,monospace;letter-spacing:.03em;color:#e5c98c;margin-top:.3em}
.say{width:max-content;max-width:min(16em,calc(100vw - 32px));background:#efe9d3;color:#1f2b23;padding:.45em .75em .5em;border-radius:.95em;font:500 calc(13px*var(--ui-scale,1))/1.3 'Segoe UI',sans-serif;box-shadow:0 3px 12px #0006;overflow-wrap:anywhere;text-align:center;--tail:50%}.say::after{content:"";position:absolute;left:var(--tail);bottom:-.36em;width:.72em;height:.72em;background:#efe9d3;transform:translateX(-50%) rotate(45deg);border-radius:.1em}.say.long{max-width:min(20em,calc(100vw - 32px));font-size:calc(12px*var(--ui-scale,1))}.say.pop{animation:pop .18s ease-out}@keyframes pop{from{opacity:0}to{opacity:1}}
.think{display:flex;gap:.28em;background:#efe9d3e6;padding:.45em .6em;border-radius:1em;box-shadow:0 2px 8px #0005;font-size:calc(11px*var(--ui-scale,1))}.think i{display:block;width:.42em;height:.42em;border-radius:50%;background:#4d574b;animation:dot 1.2s infinite ease-in-out}.think i:nth-child(2){animation-delay:.18s}.think i:nth-child(3){animation-delay:.36s}@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-.2em)}}
.zz{font:700 calc(13px*var(--ui-scale,1))/1 'Trebuchet MS',sans-serif;color:#e4e2cfcc;text-shadow:0 1px 4px #14251b}.zz{animation:zz 2.4s infinite ease-in-out}@keyframes zz{0%{opacity:0;margin-top:0}30%{opacity:1}100%{opacity:0;margin-top:-1.4em}}
body.stream header,body.stream #corner,body.stream #side,body.stream #fixture,body.stream #feed{zoom:var(--ui-scale,1)}body.stream #tools,body.stream #inspect,body.stream #status a,body.stream #status .link{display:none!important}
@media(max-width:650px){header{left:16px;right:16px;top:18px}h1{font-size:16px}.invite{font-size:9px;padding:8px;max-width:150px}header small{font-size:8px}#fixture{left:16px;top:70px;font-size:9px}#side{right:16px;top:calc(100px + var(--banner-h,0px))}#inspect{position:fixed;right:16px;left:16px;width:auto;top:100px}#feed{left:16px;bottom:62px;max-width:58%;font-size:10px;padding:6px 10px}#corner{right:16px;bottom:10px;max-width:40%}#status{font-size:9px;line-height:1.6}.badge{min-width:0;padding:6px 9px;font-size:9.5px}.badge strong{font-size:11px}.tag{font-size:calc(9px*var(--ui-scale,1))}.tag .job{font-size:calc(8px*var(--ui-scale,1))}.say{font-size:calc(11px*var(--ui-scale,1))}.say.long{font-size:calc(10.5px*var(--ui-scale,1))}}
.tag.npc{background:#3a2218dd;border:1.5px solid #e0874f;color:#ffd9b0}.tag.npc .n{font-weight:800;letter-spacing:.08em}
#happening-wrap{position:fixed;top:22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px}#happening{max-width:min(560px,calc(100vw - 600px));min-width:260px;background:#2b1a14ee;border:1.5px solid #e0874f;padding:10px 20px 11px;text-align:center;box-shadow:0 4px 18px #0006;opacity:0;visibility:hidden;transform:translateY(-14px);transition:opacity .35s,transform .35s,visibility 0s .35s}#happening.show{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .35s}#happening strong{display:block;font:800 20px 'Trebuchet MS',sans-serif;letter-spacing:.1em;color:#ffb877}#happening span{display:block;font:12px/1.45 Consolas,monospace;color:var(--ink);margin-top:3px}#happening em{display:block;font:700 18px Consolas,monospace;font-style:normal;color:#ffd9b0;margin-top:4px;letter-spacing:.08em}
body.stream #happening{zoom:var(--ui-scale,1);max-width:min(560px,calc((100vw - 600px*var(--ui-scale,1))/var(--ui-scale,1)))}
@media(max-width:1000px){#side{top:calc(118px + var(--banner-h,0px))}#happening-wrap{top:118px}#happening{max-width:calc(100vw - 32px);min-width:0}}
@media(max-width:650px){#happening-wrap{top:100px}#happening{padding:7px 12px 8px}#happening strong{font-size:15px}#happening span{font-size:10px}#happening em{font-size:14px}}
.badge{font:11px/1.55 Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:8px 14px;min-width:180px;max-width:300px}.badge strong{display:block;font:700 13px 'Trebuchet MS',sans-serif;letter-spacing:.1em;color:#e5c98c;margin-bottom:3px}.rows>div{display:flex;justify-content:space-between;gap:12px}.rows span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rows b{flex:none}#scores .rows span{color:var(--muted)}#scores .rows>div:first-child span{color:var(--ink)}#wishes b{font-weight:400;font-size:.85em;padding:0 .4em;border-radius:.6em;align-self:center}#wishes b.now{color:#1f2b23;background:#a9d98a}#wishes b.soon{color:var(--muted);border:1px solid var(--line)}.tag .job.ko{color:#9aa096;font-style:italic}
.tag .b{display:inline-flex;gap:.18em;margin-left:.45em;vertical-align:-.22em}.tag .b i{position:relative;display:inline-block;width:1.25em;height:1.25em}.tag .b svg{width:100%;height:100%;display:block}.tag .b small{position:absolute;right:-.45em;bottom:-.35em;font:700 .62em/1 Consolas,monospace;color:#f3eedc;background:#1c2724;border-radius:.6em;padding:.05em .25em}.tag .b b{font:700 .8em/1.5 Consolas,monospace;color:#e5c98c;margin-left:.15em}.tag .b.open{gap:.4em}
#happening.river{background:#14283aee;border-color:#5fb3e8}#happening.river strong{color:#9ad3ff}#happening.landmark{background:#2a2614ee;border-color:#f2c94c}#happening.landmark strong{color:#ffe08a}#happening.boss{background:#2a1418ee;border-color:#e05f5f}#happening.boss strong{color:#ff9a8a}#happening-bars{margin-top:6px;display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font:11px/1.3 Consolas,monospace;color:var(--ink);text-align:left}#happening-bars .bar{height:8px;background:#ffffff1f;border-radius:4px;overflow:hidden}#happening-bars .bar i{display:block;height:100%;background:#9ad3ff;border-radius:4px;transition:width .5s}#happening.boss #happening-bars .bar i{background:#ff7a6a}#happening-bars em{font:11px Consolas,monospace;color:var(--muted);margin:0;letter-spacing:0}
@media(prefers-reduced-motion:reduce){.say.pop,.think i,.zz{animation:none}#feed div{transition:none}#happening,#happening.show{transition:none;transform:none}}
</style></head><body><main id="world" aria-label="Live field of chat characters"></main>
<header><div><h1>AI DUDES</h1><small>EVERYONE WALKS TOGETHER</small></div><div class="invite">Say anything in chat. Your character says it, and acts it out.</div></header>
<div id="fixture" hidden>FIXTURE MODE · NO LIVE AI</div>
<div id="happening-wrap"><div id="happening" role="status" aria-live="polite"><strong id="happening-title"></strong><span id="happening-text"></span><div id="happening-bars" hidden></div><em id="happening-clock" hidden></em></div></div>
<div id="side"><div id="tools"><button id="follow" aria-pressed="true">Following everyone</button></div><section id="scores" class="badge" hidden><strong>KNOCKOUTS</strong><div id="scores-rows" class="rows"></div></section>
<aside id="inspect" hidden><strong id="inspect-name"></strong><p id="inspect-detail"></p><p id="inspect-doing"></p><p id="inspect-say" hidden></p><button id="inspect-close">Close</button></aside></div>
<div id="people" aria-hidden="true"></div>
<section id="feed" aria-live="polite" hidden></section>
<div id="corner"><section id="wishes" class="badge" hidden><strong>CHAT WANTS</strong><div id="wishes-rows" class="rows"></div></section><div id="status"><span id="ai-warn" hidden></span><span id="connection">Connecting…</span><br><span id="counts"></span><br><span id="ai"></span><span class="link"><br><a href="/admin" target="_blank" rel="noopener">Operator controls ↗</a></span></div></div>
<div id="error" hidden></div><script src="/dudes.js"></script></body></html>
